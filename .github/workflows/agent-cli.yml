# Verifies gritt-agent and checks the bundled executable build on each OS.
name: agent-cli

on:
  push:
    branches: [main]
    paths:
      - ".agents/cli/**"
      - ".github/workflows/agent-cli.yml"
      - ".cargo/**"
      - "rust-toolchain.toml"
  pull_request:
    paths:
      - ".agents/cli/**"
      - ".github/workflows/agent-cli.yml"
      - ".cargo/**"
      - "rust-toolchain.toml"

env:
  CARGO_TERM_COLOR: always
  MANIFEST: .agents/cli/Cargo.toml
  CARGO_BUILD_ARTIFACT_DIR: .agents/cli/target/verification-artifacts

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      # The integration tests compare generated files byte for byte with
      # committed fixtures, so the checkout must keep LF line endings.
      - name: Keep LF line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      # The repository root pins the compiler in `rust-toolchain.toml` so
      # product releases rebuild byte for byte; this crate is checked with
      # the same pinned version rather than a floating `stable`.
      - name: Install the pinned toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            .agents/cli/target
          key: ${{ runner.os }}-agent-cli-${{ hashFiles('.agents/cli/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-agent-cli-
      - name: cargo fmt --check
        run: cargo fmt --manifest-path ${{ env.MANIFEST }} --all --check
      - name: cargo clippy
        run: cargo clippy --manifest-path ${{ env.MANIFEST }} --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --locked --manifest-path ${{ env.MANIFEST }}
      - name: Build bundled executable
        env:
          CARGO_BUILD_ARTIFACT_DIR: .agents
        run: cargo build --release --locked --manifest-path ${{ env.MANIFEST }} --bin gritt-agent
      - name: Run bundled executable (Unix)
        if: runner.os != 'Windows'
        run: .agents/gritt-agent --version
      - name: Run bundled executable (Windows)
        if: runner.os == 'Windows'
        run: .agents\gritt-agent.exe --version
