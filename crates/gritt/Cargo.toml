[package]
name = "gritt"
description = "Gritt: run native and installed AI coding agents from one local terminal interface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "gritt"
path = "src/main.rs"

[dependencies]
gritt-core = { workspace = true }
gritt-provider = { workspace = true }
gritt-harness = { workspace = true }
gritt-connector = { workspace = true }
chrono = { workspace = true, features = ["clock"] }
clap = { workspace = true }
dirs = { workspace = true }
keyring = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
# End-to-end tests seed an old database and drive the binary in a PTY.
portable-pty = { workspace = true }
tempfile = { workspace = true }
turso = { workspace = true }
