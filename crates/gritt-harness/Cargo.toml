[package]
name = "gritt-harness"
description = "Terminal interface, policy engine, session store, and built-in tools for Gritt."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
gritt-core = { workspace = true }
gritt-provider = { workspace = true }
chrono = { workspace = true, features = ["clock"] }
crossterm = { workspace = true }
diffy = { workspace = true }
dirs = { workspace = true }
futures = { workspace = true }
ratatui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
turso = { workspace = true }
uuid = { workspace = true }

# Test-only: a scriptable MCP server the runtime tests drive as a real child
# process. Not part of the library and not built by the default workspace
# members.
[[bin]]
name = "gritt-mcp-fixture"
path = "tests/fixtures/fake_mcp_server.rs"
test = false
doc = false

[dev-dependencies]
# Test-only: the fake external agent drives the control plane.
gritt-connector = { workspace = true }
tempfile = { workspace = true }
