# Example entry (delete when adding real items):
#
#   - id: BKL-001
#     title: Short parked idea
#     summary: >-
#       One or two lines on what the idea is.
#     parked_reason: Why it is not a ticket right now.
#     revisit_when: >-
#       The concrete trigger that should reactivate this item.
#     references:
#       - .agents/memory/decisions/ADR-002-memory-routing.md

items: []
