<!DOCTYPE html>
<!-- Omit data-theme to follow the OS. Set data-theme="light" or "dark" to pin it.
     The masthead button writes this attribute; every colour in the doc keys off it. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title><!-- SLOT: doc title --></title>
<link rel="stylesheet" href="assets/doc-theme.css">
</head>

<body>

<!-- Sticky masthead. The chip states the document's status; the button toggles theme. -->
<header class="masthead">
  <div class="masthead-inner">
    <h1><!-- SLOT: doc title, lowercase; CSS uppercases it --></h1>
    <span class="chip warning status-chip"><span class="dot"></span><!-- SLOT: e.g. Proposal &middot; decision requested --></span>
    <button class="theme" id="themeBtn" type="button">Dark</button>
  </div>
  <!-- One link per <section>. Drop the nav for a doc with fewer than three sections. -->
  <nav class="toc">
    <a href="#why">Why</a>
    <a href="#what">What we propose</a>
    <a href="#how">How</a>
    <a href="#risks">Risks</a>
    <a href="#next">What is next</a>
  </nav>
</header>

<div class="wrap">

  <!-- ============ SUMMARY ============
       Opens with the conclusion. h2 + .lede, then prose, then the hero figure
       and the KPI row. margin-top:40px only on the first h2; the rest space
       themselves at 84px. -->
  <section id="summary">
    <h2 style="margin-top:40px">Summary</h2>
    <p class="lede"><!-- SLOT: one line on what this document is for --></p>

    <p><!-- SLOT: the proposal or finding in one paragraph --></p>

    <!-- SLOT: hero, kpi-row, cards, diagrams — see components.html -->
  </section>

  <!-- ============ BODY SECTIONS ============
       One <section id> per nav link, in nav order. -->
  <section id="why">
    <h2><!-- SLOT: heading --></h2>
    <p class="lede"><!-- SLOT: one-line framing --></p>
    <!-- SLOT: prose, cards, diagrams -->
  </section>

  <!-- SLOT: further sections -->

  <!-- Closes with the provenance of the numbers. -->
  <footer class="pagefoot">
    <p><!-- SLOT: where the figures come from, and the caveat on them --></p>
  </footer>
</div>

<script src="assets/doc-charts.js"></script>
<script>
  // Every chart mounts here, after the markup exists. docCharts is the runtime
  // in assets/doc-charts.js. See components.html for a call per chart type.
  // SLOT: chart mounts
</script>

</body>
</html>
