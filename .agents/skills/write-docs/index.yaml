subskills:
  - id: write-docs-markdown
    title: Markdown
    file: markdown/SKILL.md
    tags:
      - markdown
      - docs
    read_when:
      - writing or updating the Markdown file
  - id: write-docs-html
    title: HTML
    file: html/SKILL.md
    tags:
      - html
      - charts
      - design-system
    read_when:
      - writing the HTML file for the first time
      - editing an existing docs HTML file without recreating it
      - assembling the shell and component blocks under html/template
      - picking a chart, diagram, or callout component for a docs report
  - id: write-docs-polish
    title: Polish
    file: polish/SKILL.md
    tags:
      - write
    read_when:
      - both Markdown and HTML drafts exist
      - removing AI tells from the paired docs
