[package]
name = "gritt-agent"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Project-local agent CLI for Gritt: local memory, tickets, and skill metadata."
license = "MIT"
publish = false

[[bin]]
name = "gritt-agent"
path = "src/main.rs"

[lib]
name = "gritt_agent"
path = "src/lib.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6", features = ["derive"] }
regex = "1"
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["io-std", "macros", "process", "rt-multi-thread", "time"] }
turso = { version = "0.7.2", default-features = false, features = ["fts"] }

[dev-dependencies]
tempfile = "3"

# This crate is its own workspace root so the future product workspace can
# live at the repository root without absorbing it.
[workspace]
